[project]
name = "lms-backend"
version = "0.1.0"
description = "Backend for Loan Management System"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2.8",
    "django-cors-headers>=4.9.0",
    "django-sendgrid>=1.0.1",
    "django-sendgrid-v5>=1.3.0",
    "django-storages>=1.14.6",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-yasg>=1.21.11",
    "isort>=7.0.0",
    "pillow>=12.0.0",
    "psycopg2-binary>=2.9.11",
    "python-decouple>=3.8",
    "ruff>=0.14.7",
]


[tool.ruff]
line-length=120

[tool.ruff.lint]
ignore = []
exclude = ["migrations", ]
extend-select = ["E", "F", "I", "DJ"]

[tool.ruff.format]
quote-style = "double"
